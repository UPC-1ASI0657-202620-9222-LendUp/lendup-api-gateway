server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: lendup-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:20s}
          # Los servicios también responden CORS; se deja una sola copia de cada cabecera.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary X-Correlation-ID, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:5173}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, X-Correlation-ID, Idempotency-Key]
                exposed-headers: [X-Correlation-ID]
                max-age: 3600
          # El orden importa: gana la primera ruta que coincide.
          routes:
            - id: payments-loan-transactions
              uri: ${PAYMENTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/prestamos/{id}/transacciones,/api/v1/prestamos/{id}/desglose-pago
            - id: payments
              uri: ${PAYMENTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/medios-pago,/api/v1/pagos,/api/v1/pagos/**,/api/v1/garantias,/api/v1/garantias/**,/api/v1/webhooks/mercado-pago
            - id: notifications
              uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/notificaciones,/api/v1/notificaciones/**
            - id: reservations
              uri: ${RESERVATIONS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/solicitudes,/api/v1/solicitudes/**,/api/v1/reservas,/api/v1/reservas/**
            # Catálogo: configurar CATALOG_SERVICE_URL para sacar /catalogo del monolito.
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:${MONOLITH_URL:http://localhost:8080}}
              predicates:
                - Path=/api/v1/catalogo,/api/v1/catalogo/**
            # Reputación DEBE preceder a la ruta general de estudiantes de Identidad.
            - id: reputation
              uri: ${REPUTATION_SERVICE_URL:${MONOLITH_URL:http://localhost:8080}}
              predicates:
                - Path=/api/v1/prestamos/{id}/calificaciones,/api/v1/estudiantes/{id}/reputacion
            # Identidad conserva las rutas de los controladores NestJS sin StripPrefix.
            # Sin IDENTITY_SERVICE_URL se mantiene el fallback al monolito durante la migración.
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:${MONOLITH_URL:http://localhost:8080}}
              predicates:
                - Path=/api/v1/estudiantes,/api/v1/estudiantes/**,/api/v1/universidades,/api/v1/universidades/**,/api/v1/documentos/terminos
            # Evidencias: sus rutas bajo /prestamos DEBEN preceder a la general de Préstamos. Sin EVIDENCE_SERVICE_URL
            # siguen en el monolito hasta que exista su microservicio.
            - id: evidence
              uri: ${EVIDENCE_SERVICE_URL:${MONOLITH_URL:http://localhost:8080}}
              predicates:
                - Path=/api/v1/prestamos/{id}/evidencias,/api/v1/prestamos/{id}/analisis-evidencias,/api/v1/incidencias,/api/v1/incidencias/**,/api/v1/admin/incidencias,/api/v1/admin/incidencias/**
            # Préstamos va después de las rutas específicas de Pagos, Reputación y Evidencias.
            # Sin LOANS_SERVICE_URL se mantiene el fallback al monolito durante la migración.
            - id: loans
              uri: ${LOANS_SERVICE_URL:${MONOLITH_URL:http://localhost:8080}}
              predicates:
                - Path=/api/v1/prestamos,/api/v1/prestamos/**,/api/v1/calendario
            # /objetos de Sprint 1 y cualquier ruta sin microservicio siguen en el monolito.
            - id: monolith
              uri: ${MONOLITH_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/**
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    show-details: never
